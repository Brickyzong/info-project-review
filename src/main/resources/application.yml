server:
  # 固定监听端口。注意：该值会被环境变量 SERVER_PORT（Spring relaxed binding）覆盖；
  # 若运行环境误设 SERVER_PORT=0，Spring Boot 会进入随机端口模式（绑定 OS 分配的随机高端口）。
  # 一律用启动参数 --server.port=8080 显式固定（run.sh 已默认带上），避免被环境变量影响。
  port: 8080

spring:
  application:
    name: xmps-ai-review

  # ============================================================
  # 数据库配置（默认 H2 开发测试；生产切换 PostgreSQL）
  # ============================================================
  # --- dev profile (default) ---
  datasource:
    url: jdbc:h2:file:./data/xmps;AUTO_SERVER=TRUE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # 文件上传限制
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

# ============================================================
# LLM 配置（自研轻量封装，OpenAI 兼容协议）
# ============================================================
xmps:
  llm:
    provider: openai-compatible
    base-url: https://api.deepseek.com/v1
    api-key: ${LLM_API_KEY:sk-a0350899154d4d7397eb574c5aa93e1f}
    model: deepseek-chat
    timeout-seconds: 120
    max-retries: 3
    # 连接池配置
    pool:
      max-connections: 10
      max-idle: 5
      keep-alive-minutes: 5

  # ============================================================
  # API 鉴权
  # ============================================================
  security:
    api-key:
      header: Authorization
      # 生产环境通过环境变量或外部密钥管理服务注入
      keys: ${XMPS_API_KEYS:test-key-001,test-key-002}
    # IP 白名单（应用层安全加固）。留空=关闭；生产通过 XMPS_ALLOWED_IPS 注入
    # 逗号分隔的 IP / CIDR，如 10.0.0.0/8,192.168.1.0/24,203.0.113.7
    whitelist:
      allowed-ips: ${XMPS_ALLOWED_IPS:}

  # ============================================================
  # 异步任务配置
  # ============================================================
  async:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 100
    thread-name-prefix: xmps-async-

  # ============================================================
  # 回调重试
  # ============================================================
  callback:
    max-retries: 3
    retry-intervals: 10,30,60
    initial-delay-seconds: 2

  # ============================================================
  # 向量化预留（一期空实现）
  # ============================================================
  vector:
    enabled: false

  # ============================================================
  # OCR 兜底（Tesseract，扫描件/图片型文档兜底）
  # 需生产环境安装 tesseract 命令；未安装时自动关闭，不影响主解析
  # ============================================================
  ocr:
    enabled: ${XMPS_OCR_ENABLED:true}
    tesseract-path: ${XMPS_TESSERACT_PATH:tesseract}
    lang: chi_sim+eng
    min-text-length: 50

# ============================================================
# Actuator 健康检查
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ============================================================
# 日志
# ============================================================
logging:
  level:
    root: INFO
    com.xmps: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/xmps-ai-review.log
